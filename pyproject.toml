[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-systems"
version = "0.1.0"
description = "Static feasibility experiments for adaptive intermediate features"
requires-python = ">=3.10,<3.13"
dependencies = ["torch==2.5.1", "torchvision==0.20.1", "numpy==1.26.4", "Pillow==11.0.0", "psutil==6.1.0"]

[project.scripts]
adaptive-static = "adaptive_systems.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]
