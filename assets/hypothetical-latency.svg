<svg xmlns="http://www.w3.org/2000/svg" width="850" height="260" viewBox="0 0 850 260" role="img"><title>Hypothetical downstream latency and adaptation overhead</title><rect width="850" height="260" rx="16" fill="#102126"/><g fill="#e4f4ee" font-family="Arial,sans-serif"><text x="28" y="35" font-size="21" font-weight="bold">Illustrative latency breakdown (milliseconds)</text><text x="28" y="92" font-size="17">Full</text><text x="28" y="148" font-size="17">Adapted A</text><text x="28" y="204" font-size="17">Adapted B</text><text x="610" y="92">20 ms</text><text x="540" y="148">17 ms</text><text x="671" y="204">23 ms</text></g><rect x="152" y="67" width="440" height="31" rx="4" fill="#64a9c7"/><rect x="152" y="123" width="198" height="31" rx="4" fill="#64a9c7"/><rect x="350" y="123" width="176" height="31" fill="#e7ad67"/><rect x="152" y="179" width="198" height="31" rx="4" fill="#64a9c7"/><rect x="350" y="179" width="308" height="31" fill="#e7ad67"/><g font-size="13" fill="#bdd5d0" font-family="Arial,sans-serif"><text x="28" y="241">Blue = downstream; orange = controller and conversion. Hypothetical values, not experiments.</text></g></svg>